[project]
name = "drdro-software"
# Stamped by python-semantic-release from the monorepo root (one tag for the whole stack).
# Reset from the standalone drdro-software-f4 stream (1.7.0) onto the monorepo stream at
# consolidation — no installed base, so the renumber costs nothing.
version = "1.2.0"
description = "drDRO host software — Kivy DRO/controller UI for the drDRO rotary-controller board (RS485 line protocol)"
authors = [
    { name = "Stefano Bertelli", email = "stefano.bertelli@thinkalpha.io" }
]
requires-python = ">=3.10,<4.0"
license = "GPL-3.0-or-later"
readme = "README.md"
dependencies = [
    "cachetools>=5.5.0",
    "certifi>=2024.0.0",
    "keke>=0.1.4",
    "kivy>=2.3.0",
    "pyserial>=3.5",
    "pydantic>=2.10.3",
    "pyyaml>=6.0.2",
    "nmcli>=1.5.0",
    "aiohttp>=3.9.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6.9",
    "pytest>=8.3.4",
    "python-semantic-release>=9.15.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dro"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["dro"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# NOTE: releases are cut from the MONOREPO ROOT, not here. The root pyproject.toml owns
# python-semantic-release for the whole stack and stamps `project.version` above via
# version_toml — one tag versions firmware and software together. Do not re-add a
# [tool.semantic_release] section here; two configs would produce two version streams,
# which is exactly what the single-version design exists to prevent.
