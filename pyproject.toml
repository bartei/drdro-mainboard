# drdro-mainboard is not a Python project itself — this file configures
# python-semantic-release for this repo (see .github/workflows/release.yml).
#
# FIRMWARE ONLY. The host software used to live here and share this version stream; it
# now ships from drdro-software-f4, which versions itself. A tag here versions the
# firmware and nothing else: the binaries embed it via FW_VERSION at build time
# (firmware/app/support/fw_version.py, firmware/bootloader/support/bl_version.py). No
# source file in this repo carries the version.
#
# push to master/main -> OFFICIAL stable release (vX.Y.Z) when there are releasable commits
# push to dev         -> next version as a BETA prerelease (vX.Y.Z-beta.N)

[tool.semantic_release]
allow_zero_version = false
hvcs = "github"
tag_format = "v{version}"
# Runs inside `semantic-release version` with NEW_VERSION exported: builds app +
# bootloader with FW_VERSION baked in and stages firmware/dist/ for `publish` to upload.
# Asset names are the contract with the updater in drdro-software-f4 — do not rename them.
# They deliberately differ from the old board's drdro-app.bin so an updater can never
# cross-flash the two boards.
build_command = "firmware/tools/build-release.sh"

[tool.semantic_release.changelog]
# Regenerate the whole CHANGELOG.md from history on every release. The psr-10
# default ("update") silently skips the file when its insertion-flag comment is
# missing — which is exactly what happened on v1.0.0: no changelog commit was
# pushed back. Init mode needs no flag and retroactively covers past releases.
mode = "init"

[tool.semantic_release.branches.main]
match = "(master|main)"
prerelease = false

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "beta"

[tool.semantic_release.publish]
dist_glob_patterns = ["firmware/dist/*"]
upload_to_vcs_release = true
