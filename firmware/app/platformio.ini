; PlatformIO Project Configuration File — drDRO mainboard V1.5 firmware
;
; Baseline: ../../drdro-firmware-f4 (app/), which targets the older STM32F411CEU6
; board. This project retargets that proven setup to the V1.5 mainboard:
;   MCU     STM32F411CEU6 (LQFP-48)  ->  STM32F411RET6 (LQFP-64)
;   HSE     8 MHz                    ->  16 MHz   (X1 = X322516MLB4SI)
;   Comms   USART1 RS-485 only       ->  + W5500 SPI Ethernet (DHCP)
;
; Pin assignments are taken from the board netlist, not from the F4 baseline —
; see include/BoardPins.h (the authoritative map) and ../docs/mcu_pinmap.md.

[platformio]
default_envs = drdro_mainboard_v15

[env:drdro_mainboard_v15]
platform  = ststm32@~19.4.0          ; pinned for reproducible HAL/CMSIS/toolchain
board     = genericSTM32F411RE        ; STM32F411RET6 — 512K flash / 128K RAM, f_cpu 100 MHz
framework = stm32cube

; IAP layout: this image is linked into the Exec region (0x08020000, 128K) and
; runs under the bootloader in sector 0 (../bootloader). Flash both (or the
; merged factory hex) — see ../shared/Bootloader.h for the map.
board_build.ldscript = STM32F411RETX_FLASH_APP.ld

; No custom linker script: unlike the F4 baseline (which links the app at
; 0x08020000 for its IAP bootloader) this image is a plain standalone build at
; 0x08000000, so the framework default ldscript is correct. If the IAP
; bootloader is ported over later, add board_build.ldscript back here.

; Cortex-M4F hard-float on compile AND link (the board/framework default is soft;
; FreeRTOS port.c with configENABLE_FPU=1 emits hard-FPU asm), plus the git
; version stamp and a .hex for STM32CubeProgrammer.
extra_scripts =
    pre:support/stm32_hardfloat.py
    pre:support/fw_version.py
    post:support/make_hex.py
    post:support/openocd_swd_transport.py   ; ST-Link transport fix, see the script header

build_unflags = -Os
build_flags =
    -Og                           ; bring-up build: keep it debuggable under SWD
    -g3
    -I include
    -I ../shared                  ; board pin map + app/bootloader contract headers
    -D USE_HAL_DRIVER
    -D STM32F411xE
    ; ---- Board crystal X1 = 16 MHz (X322516MLB4SI, per netlist) -------------
    ; The framework default is 25 MHz and the F4 baseline used 8 MHz; either
    ; value here yields a wrong SYSCLK and therefore wrong UART baud / SPI clock.
    -D HSE_VALUE=16000000
    -D ARM_MATH_CM4
    -D ARM_MATH_MATRIX_CHECK
    -D ARM_MATH_ROUNDING
    ; ---- WIZnet ioLibrary configuration ------------------------------------
    ; The vendored header defaults to W6300, so the chip MUST be selected here.
    ; VDM (variable data mode) is the W5500 mode that frames each transaction
    ; with SCSn, which is why CS is a software GPIO on PB12 (see docs/STATUS.md).
    ; Ethernet bring-up finding (2026-07-31, verified per-mode on hardware):
    ; this W5500 does NOT receive at 100BASE-TX. With the link up in all three
    ; 100 Mbps modes, a MACRAW sniff captured 0 bytes; at 10 Mbps the same board
    ; on the same cable/switch captured ~1.7-2 KB and DHCP leased immediately.
    ; RX_RSR only counts CRC-good frames, so a PHY that cannot decode 100BASE-TX
    ; yields exactly zero. src/Net.c therefore tries 10M half FIRST. A 10 Mbps
    ; capable switch is required. Set NET_SELFTEST=1 to re-run the per-mode
    ; measurement on new hardware (adds ~40 s to boot).
    ; -D NET_SELFTEST=1
    -D _WIZCHIP_=5500
    -D _WIZCHIP_IO_MODE_=0x0201   ; _WIZCHIP_IO_MODE_SPI_VDM_
    -I lib/ioLibrary/Ethernet
    -I lib/ioLibrary/Internet/DHCP
    ; %g float formatting in the protocol (newlib-nano needs the float printf pulled in)
    -Wl,-u,_printf_float
    ; Insurance against ld rounding the first PT_LOAD down and baking the ELF
    ; header into the image (bit the baseline when the app moved off 0x08000000).
    -Wl,-z,max-page-size=0x4000

; Library Dependency Finder: resolve headers in lib/FreeRTOS and lib/ioLibrary.
lib_ldf_mode = chain+

; ioLibrary keeps its headers in nested dirs (Ethernet/, Internet/DHCP/), which the
; LDF cannot discover by include-scanning alone — name it explicitly so its sources
; always get compiled and linked. lib/ioLibrary/library.json declares the rest.
lib_deps =
    ioLibrary

; Flash / debug via ST-Link (custom board, SWD-only — JTAG pins are repurposed).
upload_protocol = stlink
debug_tool      = stlink
monitor_speed   = 115200

; NOTE: the pinned platform emits an ST-Link transport that the pinned OpenOCD no
; longer supports; support/openocd_swd_transport.py rewrites that one flag at
; upload time. See that script's header for the full explanation.

[env:native]
; Host-side unit tests for the transport-independent protocol logic (parser,
; dispatch, registry, checksum, settings image). HAL/CMSIS-RTOS are mocked
; under test/mocks/; vendored libs are excluded via their library.json
; platforms restriction. Run: pio test -d firmware/app -e native
platform        = native
test_framework  = unity
test_build_src  = yes                 ; link project src into the tests...
build_src_filter = -<*> +<Protocol.c> ; ...but only Protocol.c (the rest is HW-bound)
build_flags =
    -I include
    -I ../shared
    -I test/mocks
    -std=gnu11
    -Wall
;
; The DEBUG server is built by platform.py (not SCons), so the extra script can't
; fix it there — without the override below, `pio debug` / the VS Code debugger
; dies with "Debug adapter doesn't support 'hla_swd' transport". This is the same
; command the platform would generate, with only the transport corrected.
; (each line below is ONE argv token — PIO does not word-split them)
debug_server =
    ${platformio.packages_dir}/tool-openocd/bin/openocd
    -s
    ${platformio.packages_dir}/tool-openocd/openocd/scripts
    -f
    interface/stlink.cfg
    -c
    transport select swd
    -f
    target/stm32f4x.cfg
debug_port = localhost:3333
