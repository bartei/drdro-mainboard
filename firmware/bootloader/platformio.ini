; drDRO mainboard V1.5 IAP bootloader — standalone PlatformIO project.
; Sector 0 (16 KB) @ 0x08000000. The application is the sibling ../app project
; (linked at the Exec region 0x08020000). Shared app<->bootloader contract:
; ../shared/Bootloader.h (+ Settings.h, BlinkCode.h, BoardPins.h).
;
;   Build:  pio run            (from this bootloader/ dir, or `pio run -d firmware/bootloader`)
;   Flash:  pio run -t upload  (ST-Link; then flash the app, or use the merged factory hex)
;
; Standalone (not a second env of the app) so the source tree stays unambiguous:
; this dir IS the bootloader, ../app IS the app. No -Ofast/FreeRTOS/hard-float here
; (no motion ISR, no RTOS) — size-optimized to fit the 16 KB sector. The HSE_VALUE
; fix is still required (framework defaults to 25 MHz; board crystal X1 is 16 MHz).

[env:bootloader]
platform  = ststm32@~19.4.0           ; pinned — same platform as ../app
board     = genericSTM32F411RE        ; STM32F411RET6 — 512K flash / 128K RAM
framework = stm32cube
board_build.ldscript = STM32F411RETX_FLASH_BOOT.ld

build_flags =
    -Os
    -I ../shared                  ; app<->bootloader contract + board pin map
    -D USE_HAL_DRIVER
    -D STM32F411xE
    -D HSE_VALUE=16000000         ; board crystal X1 is 16 MHz (see ../app/platformio.ini)

extra_scripts =
    pre:support/bl_version.py     ; BL_VERSION="<git describe>" for the `version` command
    post:support/make_hex.py      ; emit firmware.hex (for the combined factory image + releases)
    post:support/openocd_swd_transport.py   ; ST-Link transport fix, see the script header

lib_ldf_mode  = chain+
upload_protocol = stlink
debug_tool      = stlink
monitor_speed   = 115200
